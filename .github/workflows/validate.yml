name: Validate SciDiagram PPTX

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: sci-diagram-pptx-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.12"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install validation dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          -r requirements-ci.txt

      - name: Validate metadata and package boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          root = Path.cwd()
          skill = root / "skills" / "sci-diagram-pptx"
          text = (skill / "SKILL.md").read_text(encoding="utf-8")
          parts = text.split("---", 2)
          assert len(parts) == 3 and not parts[0].strip(), "Missing YAML frontmatter"
          metadata = yaml.safe_load(parts[1])
          assert set(metadata) == {"name", "description"}
          assert metadata["name"] == "sci-diagram-pptx"
          assert isinstance(metadata["description"], str) and metadata["description"].strip()

          interface = yaml.safe_load(
              (skill / "agents" / "openai.yaml").read_text(encoding="utf-8")
          )["interface"]
          assert interface["display_name"] == "SciDiagram PPTX｜科研图示原生复现"
          assert 25 <= len(interface["short_description"]) <= 64
          assert "$sci-diagram-pptx" in interface["default_prompt"]

          assert (root / "LICENSE").read_bytes() == (skill / "LICENSE").read_bytes()
          assert not list(skill.rglob("README*")), "README must stay outside the Skill package"
          forbidden = [
              path for path in skill.rglob("*")
              if path.name == ".DS_Store"
              or path.name == "__pycache__"
              or path.suffix in {".pyc", ".pyo"}
          ]
          assert not forbidden, f"Platform or bytecode junk found: {forbidden}"
          python_scripts = {path.name for path in (skill / "scripts").glob("*.py")}
          assert python_scripts == {
              "check_pptx.py",
              "panel_crop.py",
              "render_pptx.py",
          }, python_scripts
          node_scripts = {path.name for path in (skill / "scripts").glob("*.mjs")}
          assert node_scripts == {"probe_runtime.mjs"}, node_scripts
          assets = {path.name for path in (skill / "assets").glob("*") if path.is_file()}
          assert assets == {"pptxgenjs-build-template.mjs"}, assets
          references = {path.name for path in (skill / "references").glob("*.md")}
          assert references == {
              "capability-matrix.md",
              "cross-platform-compatibility.md",
              "inspection.md",
              "math-and-fonts.md",
              "reconstruction.md",
              "repair.md",
              "runtime-artifact-tool.md",
              "runtime-pptxgenjs.md",
          }, references
          print("metadata and package boundary: valid")
          PY

      - name: Reject local paths and platform junk
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import zipfile

          tracked = subprocess.check_output(
              ["git", "ls-files", "-z"]
          ).decode("utf-8").split("\0")
          paths = [Path(value) for value in tracked if value and Path(value).is_file()]
          needles = (
              b"/" + b"Users" + b"/",
              b"/" + b"Volumes" + b"/",
              b"/private/" + b"tmp" + b"/",
              b"/" + b"tmp" + b"/",
              b"/" + b"home" + b"/",
              b"C:" + b"\\\\" + b"Users" + b"\\\\",
              b"C:/" + b"Users" + b"/",
          )
          failures = []
          for path in paths:
              payloads = [(str(path), path.read_bytes())]
              if path.suffix.lower() == ".pptx":
                  with zipfile.ZipFile(path) as archive:
                      payloads.extend(
                          (f"{path}!/{name}", archive.read(name))
                          for name in archive.namelist()
                          if not name.endswith("/")
                      )
              for label, payload in payloads:
                  for needle in needles:
                      if needle in payload:
                          failures.append(
                              f"{label}: contains {needle.decode('ascii')}"
                          )
          assert not failures, "\n".join(failures)
          print("local path scan: clean")
          PY

      - name: Compile Python surfaces
        run: |
          python -m compileall -q skills/sci-diagram-pptx/scripts
          python -m compileall -q tests

      - name: Run panel crop regression
        run: python -B tests/test_panel_crop.py

      - name: Run lightweight PPTX checker regressions
        run: python -B tests/test_check.py

      - name: Validate reproducible case bundles
        run: |
          expected=(
            ecosystem-services-assessment
            global-innovation-industry-chain
            l-plantarum-scs2-islet-cell-injury-mechanism
            municipal-solid-waste-ghg-accounting-framework
            osteoporosis-pedicle-screw-biomechanics
            water-nitrogen-low-carbon-optimization
          )
          mapfile -t actual < <(
            find examples/cases -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort
          )
          test "${actual[*]}" = "${expected[*]}"

          for case_dir in examples/cases/*; do
            mapfile -t files < <(
              find "$case_dir" -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | sort
            )
            test "${files[*]}" = "build.mjs editable.pptx source.png"
            python -B skills/sci-diagram-pptx/scripts/check_pptx.py \
              "$case_dir/editable.pptx" \
              --source "$case_dir/source.png" \
              --build-source "$case_dir/build.mjs" \
              --require-single-slide \
              --output "$RUNNER_TEMP/$(basename "$case_dir").json"
          done

      - name: Smoke every documented CLI
        run: |
          for script in \
            panel_crop.py \
            check_pptx.py \
            render_pptx.py
          do
            python -B "skills/sci-diagram-pptx/scripts/$script" --help >/dev/null
          done

      - name: Check relative README and Skill links
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          root = Path.cwd()
          files = [root / "README.md", root / "skills/sci-diagram-pptx/SKILL.md"]
          files.extend((root / "skills/sci-diagram-pptx/references").glob("*.md"))
          missing = []
          markdown_link = re.compile(r"\[[^\]]*\]\(([^)]+)\)")
          html_link = re.compile(r"(?:href|src)=\"([^\"]+)\"")
          for path in files:
              text = path.read_text(encoding="utf-8")
              for target in markdown_link.findall(text) + html_link.findall(text):
                  if not target or target.startswith(("#", "http://", "https://", "mailto:")):
                      continue
                  clean = target.split("#", 1)[0]
                  if clean and not (path.parent / clean).resolve().exists():
                      missing.append(f"{path}: {target}")
          assert not missing, "Missing relative links:\n" + "\n".join(missing)
          print("relative links: valid")
          PY

  portable:
    name: Portable Node runtime
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install portable rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libreoffice-impress \
            poppler-utils \
            fonts-noto-cjk \
            fonts-noto-core \
            fonts-liberation
          python -m pip install --disable-pip-version-check -r requirements-ci.txt
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Check portable JavaScript surfaces
        run: |
          node --check skills/sci-diagram-pptx/scripts/probe_runtime.mjs
          node --check skills/sci-diagram-pptx/assets/pptxgenjs-build-template.mjs

      - name: Run portable authoring and rendering regression
        env:
          SCI_DIAGRAM_RUNTIME: pptxgenjs
        run: python -B tests/test_portable_runtime.py

  required:
    name: validate
    needs:
      - validate
      - portable
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all validation jobs
        env:
          MATRIX_RESULT: ${{ needs.validate.result }}
          PORTABLE_RESULT: ${{ needs.portable.result }}
        run: |
          test "$MATRIX_RESULT" = "success"
          test "$PORTABLE_RESULT" = "success"
